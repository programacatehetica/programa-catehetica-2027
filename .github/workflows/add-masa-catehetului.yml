name: Add practical catechist workspace to atlas

on:
  push:
    paths:
      - '.github/workflows/add-masa-catehetului.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Masa catehetului
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('atlas-catehetic.html')
          s=p.read_text(encoding='utf-8')

          css='''\n.workspace{margin:74px auto 0}.workspace-head{text-align:center;max-width:820px;margin:0 auto 28px}.workspace-head .eyebrow{margin-bottom:8px}.workspace-head h2{font-family:Palatino,'Book Antiqua',Georgia,serif;font-size:2rem;font-weight:500;margin:0 0 8px}.workspace-head p{margin:0;color:var(--muted)}.desk{border:1px solid #d4cabe;border-radius:28px;background:rgba(255,255,255,.7);padding:28px;box-shadow:0 10px 28px rgba(68,53,42,.05)}.desk-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.desk-tab{border:1px solid rgba(111,47,47,.18);background:#fff;border-radius:16px;padding:17px 14px;cursor:pointer;text-align:left;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.desk-tab strong{display:block;font-family:Palatino,'Book Antiqua',Georgia,serif;font-size:1.05rem;font-weight:600;margin-bottom:4px}.desk-tab span{display:block;font-size:.82rem;color:#6a625b;line-height:1.45}.desk-tab.active{border-color:var(--burgundy);box-shadow:inset 0 0 0 1px var(--burgundy);background:#fbf8f5}.desk-body{margin-top:18px;border-top:1px solid #ded6cc;padding-top:22px}.desk-panel{display:none}.desk-panel.active{display:block}.desk-panel h3{font-family:Palatino,'Book Antiqua',Georgia,serif;font-size:1.35rem;font-weight:500;margin:0 0 8px}.desk-panel>p{margin:0 0 18px;color:#5d554f}.prep-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px}.prep-box{border:1px solid #ddd5cb;border-radius:18px;background:#fff;padding:20px}.prep-box label{display:block;text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;color:var(--burgundy);font-weight:700;margin-bottom:8px}.prep-box select{width:100%;padding:11px 12px;border:1px solid #cfc5ba;border-radius:10px;background:#fff;font-family:Georgia,'Times New Roman',serif;color:var(--ink)}.prep-result{margin-top:14px;padding-top:14px;border-top:1px solid #eee8e1}.prep-result b{color:var(--burgundy)}.prep-result ul{margin:9px 0 0;padding-left:19px}.prep-result li{margin:5px 0}.bridge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bridge{padding:18px;border-radius:17px;border:1px solid #d9d1c7;background:#fff}.bridge .arrow{color:var(--burgundy);font-size:1.15rem}.bridge strong{display:block;font-family:Palatino,'Book Antiqua',Georgia,serif;margin:6px 0 5px}.bridge p{margin:0;color:#5f5750;font-size:.9rem}.use-note{margin-top:18px;padding:13px 15px;border-left:3px solid var(--burgundy);background:#f6f1ed;color:#5d554f;font-size:.9rem}\n'''
          if '.workspace{' not in s:
              s=s.replace('@media(max-width:820px)', css+'@media(max-width:820px)',1)
              s=s.replace('.theme-grid{grid-template-columns:1fr}', '.theme-grid{grid-template-columns:1fr}.desk-tabs{grid-template-columns:1fr}.prep-grid,.bridge-grid{grid-template-columns:1fr}',1)

          html='''\n<section class="workspace" id="masa-catehetului"><div class="workspace-head"><p class="eyebrow">Instrument de lucru</p><h2>Masa catehetului</h2><p>Din atlas direct în pregătirea unei întâlniri. Instrumentul folosește numai structura, titlurile și legăturile tematice prezente în cele trei materiale.</p></div><div class="desk"><div class="desk-tabs"><button class="desk-tab active" data-desk="pregatesc"><strong>Pregătesc întâlnirea</strong><span>Aleg cateheza și văd reperele de orientare.</span></button><button class="desk-tab" data-desk="tema"><strong>Caut o temă</strong><span>Pornesc de la o temă și ajung la textele în care este dezvoltată.</span></button><button class="desk-tab" data-desk="punte"><strong>Caut o legătură</strong><span>Urmăresc punțile reale dintre cele trei cicluri.</span></button></div><div class="desk-body"><div class="desk-panel active" id="desk-pregatesc"><h3>Pregătesc o cateheză</h3><p>Alege una dintre cele 20 de cateheze. Fișa de orientare indică locul ei în ciclu și axa principală formulată chiar de material.</p><div class="prep-grid"><div class="prep-box"><label for="cateheza-select">Cateheza</label><select id="cateheza-select"><optgroup label="Postul Mare"><option value="pm1">1. Crucea – izvorul Tainelor</option><option value="pm2">2. Aducerea aminte de moarte</option><option value="pm3">3. Aducerea aminte de judecată</option><option value="pm4">4. Aducerea aminte de rai</option><option value="pm5">5. Aducerea aminte de iad</option></optgroup><optgroup label="Cultul Maicii Domnului"><option value="md1">1. Despre Preacinstirea Maicii Domnului</option><option value="md2">2. Despre Maica Domnului – considerații generale</option><option value="md3">3. Maica Domnului și familia creștină</option><option value="md4">4. Despre Sărbătoarea Nașterii Maicii Domnului</option><option value="md5">5. Despre Sărbătoarea Bunei Vestiri</option><option value="md6">6. Maica Domnului și Întruparea Fiului lui Dumnezeu</option><option value="md7">7. Lucrarea minunată a Maicii Domnului</option><option value="md8">8. Suferința Maicii Domnului la răstignirea Domnului Hristos</option><option value="md9">9. Cum o facem pe Maica Domnului să nu mai plângă?</option><option value="md10">10. Despre Sărbătoarea Adormirii Maicii Domnului</option></optgroup><optgroup label="Postul Nașterii Domnului"><option value="cr1">1. Nașterea Domnului în Noul Testament</option><option value="cr2">2. Crăciunul – sărbătoare a păcii</option><option value="cr3">3. Crăciunul – sărbătoare a darurilor</option><option value="cr4">4. La Crăciun Îl aflăm pe Dumnezeu</option><option value="cr5">5. Nașterea Domnului nostru Iisus Hristos</option></optgroup></select><div class="prep-result" id="prep-result"></div></div><div class="prep-box"><label>Cum folosesc fișa</label><div class="prep-result"><ul><li>pornești de la titlul și axa reală a catehezei;</li><li>deschizi în material pasajele biblice și liturgice indicate de text;</li><li>urmărești legăturile către alte cateheze numai acolo unde ele există în material;</li><li>păstrezi textul integral al Mitropolitului drept sursa de bază.</li></ul></div></div></div></div><div class="desk-panel" id="desk-tema"><h3>Caut o temă</h3><p>Folosește filtrele din „Harta ideilor” de mai sus. Fiecare filtru păstrează vizibile numai nodurile în care tema este explicit prezentă.</p><div class="use-note">Exemplu practic: alegi <b>Întruparea</b> și obții imediat puntea dintre Buna Vestire, „Maica Domnului și Întruparea Fiului lui Dumnezeu” și catehezele despre Nașterea Domnului. Alegi <b>Crucea</b> și vezi legătura dintre „Crucea – izvorul Tainelor” și catehezele despre suferința Maicii Domnului la Răstignire.</div></div><div class="desk-panel" id="desk-punte"><h3>Caut o legătură între cicluri</h3><p>Aceste punți sunt construite numai din teme care apar explicit în textele transmise.</p><div class="bridge-grid"><div class="bridge"><span class="arrow">✝ → ΜΡ</span><strong>Crucea și Maica Domnului</strong><p>„Crucea – izvorul Tainelor” se întâlnește cu „Suferința Maicii Domnului la răstignirea Domnului Hristos” și cu „Cum o facem pe Maica Domnului să nu mai plângă?”.</p></div><div class="bridge"><span class="arrow">ΜΡ → ✦</span><strong>Maica Domnului și Întruparea</strong><p>Buna Vestire și „Maica Domnului și Întruparea Fiului lui Dumnezeu” conduc firesc spre catehezele despre Nașterea Domnului.</p></div><div class="bridge"><span class="arrow">✝ → ✦</span><strong>Mântuirea: Cruce și Naștere</strong><p>Primul ciclu urmărește Jertfa și Tainele; ciclul Crăciunului urmărește venirea în lume a Fiului lui Dumnezeu pentru mântuirea omului.</p></div></div></div></div></div></section>'''
          if 'id="masa-catehetului"' not in s:
              anchor='<div class="method">'
              if anchor in s:
                  s=s.replace(anchor, html+anchor,1)
              else:
                  s=s.replace('<p class="signature">',html+'<p class="signature">',1)

          data='''\n<script>\nconst prep={pm1:['Postul Mare','Crucea ca izvor al Tainelor; Jertfa de pe Golgota și actualizarea ei în Sfânta Liturghie.',['Crucea','Sfintele Taine','Sfânta Liturghie','Botezul','Euharistia']],pm2:['Postul Mare','Aducerea aminte de moarte și întrebarea despre viața veșnică, legate de nașterea din nou prin Taine.',['moartea','viața veșnică','Nicodim','Crucea','Tainele']],pm3:['Postul Mare','Aducerea aminte de judecată, cu accent pe răspunderea pentru fapte și pe Judecata universală.',['judecata','faptele','Matei 25','milostenia']],pm4:['Postul Mare','Aducerea aminte de rai și dorința vieții veșnice cu Dumnezeu.',['raiul','Apocalipsa','viața veșnică']],pm5:['Postul Mare','Aducerea aminte de iad, libertatea omului și Judecata universală.',['iadul','libertatea','judecata','Matei 25']],md1:['Cultul Maicii Domnului','Temeiurile preacinstirii Maicii Domnului și trăirea lor în rugăciune, Paraclis și cântare.',['preacinstire','Paraclis','rugăciune','pricesne']],md2:['Cultul Maicii Domnului','Adormirea Maicii Domnului în lumina Sfintei Tradiții și a vieții liturgice.',['Adormirea','Sfânta Tradiție','icoana','cultul']],md3:['Cultul Maicii Domnului','Maica Domnului și familia creștină, pornind de la familia în care a crescut Domnul Hristos.',['familia','grija maternă','Ioan 19']],md4:['Cultul Maicii Domnului','Nașterea Maicii Domnului și mărturia Sfintei Tradiții despre Ioachim și Ana.',['Nașterea Maicii Domnului','Ioachim și Ana','Sfânta Tradiție']],md5:['Cultul Maicii Domnului','Buna Vestire și ascultarea Fecioarei Maria în iconomia mântuirii.',['Buna Vestire','ascultarea','mântuirea']],md6:['Cultul Maicii Domnului','Întruparea Fiului lui Dumnezeu prin lucrarea Duhului Sfânt și din Fecioara Maria.',['Întruparea','Ioan 1,14','Crezul','Fecioara Maria']],md7:['Cultul Maicii Domnului','Lucrarea Maicii Domnului în iconomia mântuirii și mărturia patristică despre rolul ei.',['Maica Domnului','mântuirea','Sfântul Proclu']],md8:['Cultul Maicii Domnului','Suferința Maicii Domnului la Răstignirea Mântuitorului.',['Crucea','suferința','Ioan 19,25–27']],md9:['Cultul Maicii Domnului','Durerea Maicii Domnului și chemarea la îndreptarea vieții.',['lacrimile Maicii Domnului','Crucea','îndreptarea vieții']],md10:['Cultul Maicii Domnului','Adormirea Maicii Domnului în Sfânta Tradiție, cult și memoria pelerinajului.',['Adormirea','Sfânta Tradiție','pelerinajul','troparul']],cr1:['Postul Nașterii Domnului','Nașterea Domnului în mărturia Noului Testament și taina Întrupării.',['Nașterea Domnului','Noul Testament','Întruparea']],cr2:['Postul Nașterii Domnului','Crăciunul ca sărbătoare a păcii, a bucuriei și a împăcării omului cu Dumnezeu.',['pacea','bucuria','împăcarea','Isaia','Luca 2']],cr3:['Postul Nașterii Domnului','Crăciunul ca sărbătoare a darurilor: Hristos, darul Tatălui, și răspunsul omului prin iubire.',['darul','Hristos','iubirea','comuniunea']],cr4:['Postul Nașterii Domnului','La Crăciun Îl aflăm pe Dumnezeu, pornind de la pericopele Nașterii după Matei și Luca.',['aflarea lui Dumnezeu','Matei','Luca','Betleem']],cr5:['Postul Nașterii Domnului','Nașterea Domnului Iisus Hristos ca moment unic al venirii Fiului lui Dumnezeu pentru mântuirea lumii.',['Nașterea Domnului','Luca 2','mântuirea']]};\nfunction renderPrep(){const v=document.getElementById('cateheza-select').value,d=prep[v],r=document.getElementById('prep-result');r.innerHTML='<b>'+d[0]+'</b><p>'+d[1]+'</p><ul>'+d[2].map(x=>'<li>'+x+'</li>').join('')+'</ul>';}\ndocument.querySelectorAll('.desk-tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.desk-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.desk-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('desk-'+b.dataset.desk).classList.add('active')}));\nconst cs=document.getElementById('cateheza-select');if(cs){cs.addEventListener('change',renderPrep);renderPrep();}\n</script>\n'''
          if 'const prep={' not in s:
              s=s.replace('</body>',data+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-catehetic.html
          git diff --cached --quiet && exit 0
          git commit -m "Add practical Masa catehetului to atlas"
          git push
