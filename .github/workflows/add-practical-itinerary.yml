name: Add practical itinerary builder
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-practical-itinerary.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert practical builder into atlas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('atlas-catehetic.html')
          s=p.read_text(encoding='utf-8')
          if 'pregateste-cateheza.html' not in s:
              css='''\n.practical-launch{margin:54px auto 0;max-width:920px;padding:30px 32px;border:1px solid #d4cabe;border-radius:26px;background:#fff;box-shadow:0 10px 28px rgba(68,53,42,.05);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}.practical-launch .eyebrow{margin:0 0 7px}.practical-launch h2{font-family:Palatino,'Book Antiqua',Georgia,serif;font-size:1.8rem;font-weight:500;margin:0 0 8px}.practical-launch p{margin:0;color:#615850;max-width:690px}.practical-launch a{display:inline-block;padding:12px 16px;border-radius:12px;background:var(--burgundy);color:#fff;text-decoration:none;font-weight:700;white-space:nowrap}@media(max-width:760px){.practical-launch{grid-template-columns:1fr}.practical-launch a{text-align:center}}\n'''
              s=s.replace('</style>',css+'</style>')
              block='''\n<section class="practical-launch" aria-label="Constructor practic de parcurs catehetic"><div><p class="eyebrow">Instrument practic</p><h2>Îmi pregătesc cateheza</h2><p>Alege perioada, tema și timpul disponibil. Atlasul construiește o fișă de parcurs cu text biblic, axă de lucru, întrebări pentru dialog și continuarea traseului tematic.</p></div><a href="./pregateste-cateheza.html">Construiește parcursul →</a></section>\n'''
              marker='<section class="workspace">'
              if marker in s:
                  s=s.replace(marker,block+marker,1)
              else:
                  s=s.replace('<footer>',block+'<footer>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit atlas update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas-catehetic.html
          git diff --cached --quiet || git commit -m "Add practical catechetical route builder to atlas"
          git push