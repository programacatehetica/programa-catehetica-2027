name: Link Metropolitan indexes
on:
  push:
    paths:
      - '.github/workflows/link-metropolitan-indexes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add indexed-text links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('atlas-catehetic.html')
          s=p.read_text()
          reps={
          '<h3>Răstignirea duhovnicească</h3>':'<h3>Răstignirea duhovnicească</h3><p><a href="./texte-mitropolit-postul-mare.html" style="color:#6f2f2f;font-weight:700">Deschide textele indexate →</a></p>',
          '<h3>Cultul Maicii Domnului în Biserica Ortodoxă</h3>':'<h3>Cultul Maicii Domnului în Biserica Ortodoxă</h3><p><a href="./texte-mitropolit-adormirea.html" style="color:#6f2f2f;font-weight:700">Deschide textele indexate →</a></p>',
          '<h3>Crăciunul – sărbătoare a păcii</h3>':'<h3>Crăciunul – sărbătoare a păcii</h3><p><a href="./texte-mitropolit-craciun.html" style="color:#6f2f2f;font-weight:700">Deschide textele indexate →</a></p>'}
          for a,b in reps.items():
              if b not in s: s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add atlas-catehetic.html
          git diff --cached --quiet || git commit -m 'Link indexed Metropolitan Andrei texts from atlas'
          git push