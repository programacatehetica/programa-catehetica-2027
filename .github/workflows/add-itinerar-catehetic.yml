name: Build Part III catechetical atlas

on:
  push:
    paths:
      - '.github/workflows/add-itinerar-catehetic.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Part III on homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          new_css='''.itinerary{margin-top:72px;padding:52px 0 0;border-top:2px solid #cfc6ba}.itinerary .section-head{margin:0 auto 28px}.itinerary-entry{display:block;position:relative;overflow:hidden;max-width:920px;margin:0 auto;padding:34px 36px 30px;border:1px solid #cfc6ba;border-radius:26px;background:linear-gradient(135deg,rgba(241,227,225,.78),rgba(229,235,238,.72) 52%,rgba(241,232,216,.78));color:var(--ink);text-decoration:none;box-shadow:0 10px 28px rgba(68,53,42,.055);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.itinerary-entry:hover{transform:translateY(-3px);border-color:#9e7474;box-shadow:0 14px 34px rgba(68,53,42,.085)}.atlas-mark{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:10px;max-width:600px;margin:0 auto 26px}.atlas-line{height:1px;background:rgba(111,47,47,.34)}.atlas-node{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(111,47,47,.28);color:var(--burgundy);font-family:Palatino,'Book Antiqua',Georgia,serif;font-size:1.1rem}.itinerary-entry .atlas-label{text-align:center;text-transform:uppercase;letter-spacing:.12em;font-size:.74rem;color:#766b64}.itinerary-entry h3{text-align:center;font-family:Palatino,'Book Antiqua',Georgia,serif;font-size:1.65rem;line-height:1.3;font-weight:500;margin:8px 0 10px}.itinerary-entry p{max-width:720px;margin:0 auto;text-align:center;color:#5b534d;font-family:Palatino,'Book Antiqua',Georgia,serif}.itinerary-entry .explore{display:block;width:max-content;margin:24px auto 0;padding:9px 15px;border:1px solid rgba(111,47,47,.25);border-radius:999px;background:rgba(255,255,255,.75);color:var(--burgundy);font-size:.88rem;font-weight:700}.itinerary-note{text-align:center;margin:18px auto 0;max-width:760px;font-family:Palatino,'Book Antiqua',Georgia,serif;font-style:italic;color:#6a625b}'''
          s=re.sub(r'\.itinerary\{.*?(?=@media\(max-width:800px\))',new_css+'\n',s,flags=re.S)
          s=s.replace('.annual-grid{grid-template-columns:1fr}.itinerary-grid{grid-template-columns:1fr}.itinerary-card{min-height:260px}', '.annual-grid{grid-template-columns:1fr}.itinerary-entry{padding:28px 20px}.atlas-mark{grid-template-columns:1fr auto 1fr auto 1fr}.atlas-node{width:46px;height:46px}',1)
          new_html='''<section class="itinerary" aria-labelledby="itinerary-title"><div class="section-head"><p class="section-kicker">Partea a III-a</p><h2 id="itinerary-title">Itinerar</h2><p>O lectură transversală a catehezelor Mitropolitului Andrei, organizată ca atlas de teme, legături și repere duhovnicești.</p></div><a class="itinerary-entry" href="./atlas-catehetic.html"><div class="atlas-mark"><span class="atlas-node">✝</span><span class="atlas-line"></span><span class="atlas-node">ΜΡ</span><span class="atlas-line"></span><span class="atlas-node">✦</span></div><span class="atlas-label">Atlas catehetic</span><h3>Explorează ideile care traversează marile perioade de post</h3><p>Scriptură, Liturghie, viață duhovnicească, Tradiție și mărturisire — reunite într-o hartă care va conduce direct spre catehezele în care fiecare temă este dezvoltată.</p><span class="explore">Deschide atlasul catehetic →</span></a><p class="itinerary-note">Cateheze ale Înaltpreasfințitului Părinte Andrei, Mitropolitul Clujului, Maramureșului și Sălajului</p></section>'''
          s=re.sub(r'<section class="itinerary".*?</section>',new_html,s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine Part III as catechetical atlas"
          git push
