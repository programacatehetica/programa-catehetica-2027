name: Add Part III catechetical itinerary

on:
  push:
    paths:
      - '.github/workflows/add-itinerar-catehetic.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Part III to homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n.itinerary{margin-top:72px;padding:52px 0 0;border-top:2px solid #cfc6ba}.itinerary .section-head{margin:0 auto 34px}.itinerary-intro{max-width:760px;margin:0 auto 30px;text-align:center;color:#625b54;font-family:Palatino,'Book Antiqua',Georgia,serif}.itinerary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.itinerary-card{position:relative;overflow:hidden;display:flex;min-height:330px;padding:32px 28px;border:1px solid rgba(84,72,62,.18);border-radius:24px;color:var(--ink);text-decoration:none;flex-direction:column;justify-content:space-between;box-shadow:0 8px 22px rgba(68,53,42,.045);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.itinerary-card:hover{transform:translateY(-4px);border-color:#9e7474;box-shadow:0 14px 30px rgba(68,53,42,.08)}.itinerary-card:nth-child(1){background:var(--rose)}.itinerary-card:nth-child(2){background:var(--blue)}.itinerary-card:nth-child(3){background:var(--sand)}.itinerary-number{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:#746b64}.itinerary-symbol{font-family:Georgia,serif;font-size:2.4rem;line-height:1;color:var(--burgundy);margin:18px 0}.itinerary-card h3{font-family:Palatino,'Book Antiqua',Georgia,serif;font-size:1.45rem;line-height:1.3;font-weight:500;margin:0 0 10px}.itinerary-card .period{font-size:.92rem;color:#625b54;margin:0 0 18px}.itinerary-card .explore{margin-top:auto;padding-top:20px;border-top:1px solid rgba(111,47,47,.18);font-size:.9rem;font-weight:600;color:var(--burgundy)}.itinerary-note{text-align:center;margin:26px auto 0;max-width:760px;font-family:Palatino,'Book Antiqua',Georgia,serif;font-style:italic;color:#6a625b}\n'''
          marker='@media(max-width:800px)'
          if '.itinerary{' not in s:
              s=s.replace(marker,css+marker,1)
              s=s.replace('.annual-grid{grid-template-columns:1fr}', '.annual-grid{grid-template-columns:1fr}.itinerary-grid{grid-template-columns:1fr}.itinerary-card{min-height:260px}',1)
          html='''\n<section class="itinerary" aria-labelledby="itinerary-title"><div class="section-head"><p class="section-kicker">Partea a III-a</p><h2 id="itinerary-title">Itinerar catehetic cu Mitropolitul Andrei</h2><p>Trei cicluri catehetice pentru marile perioade de post, reunite într-un parcurs de lectură și aprofundare.</p></div><div class="itinerary-grid"><a class="itinerary-card" href="./itinerar-postul-mare.html"><div><span class="itinerary-number">Itinerar I</span><div class="itinerary-symbol">✝</div><h3>Răstignirea duhovnicească</h3><p class="period">Postul Mare</p></div><span class="explore">Explorează catehezele →</span></a><a class="itinerary-card" href="./itinerar-adormirea-maicii-domnului.html"><div><span class="itinerary-number">Itinerar II</span><div class="itinerary-symbol">ΜΡ ΘΥ</div><h3>Cultul Maicii Domnului în Biserica Ortodoxă</h3><p class="period">Postul Adormirii Maicii Domnului</p></div><span class="explore">Explorează catehezele →</span></a><a class="itinerary-card" href="./itinerar-nasterea-domnului.html"><div><span class="itinerary-number">Itinerar III</span><div class="itinerary-symbol">✦</div><h3>Crăciunul – sărbătoare a păcii</h3><p class="period">Postul Nașterii Domnului</p></div><span class="explore">Explorează catehezele →</span></a></div><p class="itinerary-note">Cateheze ale Înaltpreasfințitului Părinte Andrei, Mitropolitul Clujului, Maramureșului și Sălajului</p></section>'''
          if 'id="itinerary-title"' not in s:
              s=s.replace('<footer>',html+'<footer>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Part III catechetical itinerary"
          git push
